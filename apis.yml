aid: highway-9-networks
name: Highway 9 Networks
description: >-
  Highway 9 Networks delivers AI Wireless Infrastructure as a Service, providing
  secure private mobile networks and deterministic 5G connectivity for enterprise
  AI workloads. Its Virtual Mobile/AI Cloud (VMC) platform combines a cloud control
  plane (Mobile Center), distributed edge running a 5G core and AI services (Mobile
  Edge), private 5G wireless infrastructure (Mobile Network), and connected device
  and robot fleets (Mobile Zones) to give autonomous robots, cameras, and edge
  devices ultra-reliable, ultra-low-latency connectivity across manufacturing,
  warehousing, higher education, and energy environments. Highway 9 exposes Mobile
  Center streaming APIs for orchestration, telemetry, device management, alerting,
  and analytics, though the full specification is available only through its partner
  portal for signed partners. The company is backed by Mayfield and was added to the
  API Evangelist network as an enriched provider profile.
