apis:
- name: Highway 9 Mobile Center Streaming APIs
  description: >-
    Streaming APIs for orchestration, telemetry, device management, alerting, and
    analytics on Highway 9 private mobile networks. Resource areas include access
    and configuration (AccessConfig, Configure), device management (DeviceInfo,
    DeviceGroup), alerts and notifications (Alarm, alertProfile, alertsTemplate),
    audit and analytics (AuditLog), security and authentication (apiToken,
    Certificate), application management (Application, Attribute), operator metadata
    (carrierInfo, mnoOperator), and automation (chatbot). Full specifications are
    available through the Highway 9 partner portal for signed partners.
